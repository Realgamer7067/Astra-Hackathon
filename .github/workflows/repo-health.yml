name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate instructions, docs and tasks
        run: python scripts/repo_health.py
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked
          npm ci --no-audit
      - name: Run project checks (required once code exists)
        run: python scripts/run_project_checks.py

