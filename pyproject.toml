[project]
name = "astra-orbital-collision-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.3,<9",
    "fastapi>=0.165,<0.166",
    "httpx>=0.28.1",
    "numpy>=2,<3",
    "pydantic>=2.14,<3",
    "sgp4>=2.27",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = ["bandit>=1.8,<2", "httpx>=0.28,<0.29", "mypy>=2,<3", "pytest>=9,<10", "ruff>=0.17,<0.18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
